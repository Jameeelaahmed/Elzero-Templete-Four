<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <!-- ! Font awesome -->
    <script src="https://kit.fontawesome.com/e2f07e1c8d.js" crossorigin="anonymous"></script>
    <!-- ! BOX ICONS -->
    <link rel="stylesheet" href="https://unpkg.com/boxicons@latest/css/boxicons.min.css">
</head>

<body>
    <div class="page">
        <div class="sidebar">
            <h3>Jam</h3>
            <ul>
                <li>
                    <a href="index.html">
                        <i class="fa-solid fa-chart-simple fa-fw"></i>
                        <span>Dashboard</span>
                    </a>
                </li>
                <li>
                    <a class="active" href="setting.html">
                        <i class="fa-solid fa-gear fa-fw"></i>
                        <span>Setting</span>
                    </a>
                </li>
                <li>
                    <a href="">
                        <i class="fa-solid fa-user fa-fw"></i>
                        <span>Profile</span>
                    </a>
                </li>
                <li>
                    <a href="">
                        <i class="fa-solid fa-diagram-project fa-fw"></i>
                        <span>Projects</span>
                    </a>
                </li>
                <li>
                    <a href="">
                        <i class="fa-solid fa-graduation-cap fa-fw"></i>
                        <span>Courses</span>
                    </a>
                </li>
                <li>
                    <a href="">
                        <i class="fa-regular fa-circle-user fa-fw"></i>
                        <span>Friends</span>
                    </a>
                </li>
                <li>
                    <a href="">
                        <i class="fa-regular fa-file fa-fw"></i>
                        <span>Files</span>
                    </a>
                </li>
                <li>
                    <a href="">
                        <i class="fa-regular fa-credit-card fa-fw"></i>
                        <span>Plans</span>
                    </a>
                </li>
            </ul>
        </div>
        <div class="content">
            <header>
                <div class="search">
                    <input type="search" placeholder="type a keyword">
                </div>
                <div class="profile">
                    <div class="notfication">
                        <i class="fa-regular fa-bell fa-lg"></i>
                    </div>
                    <div class="image">
                        <img src="assets/imgs/avatar.png " alt="">
                    </div>
                </div>
            </header>
            <div class="setting">
                <h1 class="main-title">Setting</h1>
                <div class="setting-content">
                    <div class="site-control card-main">
                        <h1 class="h1-main">Site Control</h1>
                        <p class="p-main">Control The Website If There Is Maintenance</p>
                        <div class="head">
                             <div class="info">
                                <h3>Website Control</h3>
                                <p class="p-main">Open/Close Website And Type The Reason</p>
                            </div>
                            <div>
                                <!-- todo toggle-->
                            </div>
                        </div>
                        <textarea name="" placeholder="Close Message"></textarea>
                    </div>
                    <div class="general-info card-main">
                        <h1 class="h1-main">General Info</h1>
                        <p class="p-main">General Information About Your Account</p>
                        <div class="info">
                            <div class="fname">
                                <label for="fname">First Name</label>
                                <input type="text" name="fname" placeholder="First Name">
                            </div>
                            <div class="lname">
                                <label for="lname">Last Name</label>
                                <input type="text" name="lname" placeholder="Last Name">
                            </div>
                            <div class="email">
                                <div class="mail">
                                    <label for="email">Email</label>
                                    <input type="email" name="email" placeholder="o@nn.sa" id="">
                                </div>
                                <a href="">Change</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
</body>
</html>
